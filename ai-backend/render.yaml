services:
  - type: web
    name: sysmind-ai-backend
    env: python
    region: singapore
    plan: free
    runtime: python
    pythonVersion: "3.11.9"
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: MONGO_URI
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: FRONTEND_URL
        value: https://sysmind.vercel.app
      - key: PORT
        value: 8000
      - key: PYTHON_VERSION
        value: "3.11.9"
